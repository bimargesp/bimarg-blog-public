name: Deploy Blog BIMARG

on:
  push:
    branches: [main]
  schedule:
    # Antes: "0 * * * *" (cada hora, 720 corridas/mes, 36% del cupo gratis).
    # Ahora: 09:00 y 18:00 ART = 12:00 y 21:00 UTC. 60 corridas/mes.
    # Para publicar al instante: Actions > Deploy Blog BIMARG > Run workflow.
    - cron: "0 12,21 * * *"
  workflow_dispatch:

# Si una corrida queda colgada, la siguiente la cancela en vez de apilarse.
# Esto solo ya habria evitado el consumo del 17 al 19 de agosto.
concurrency:
  group: deploy-blog
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build desde Notion + Deploy Cloudflare Pages
    runs-on: ubuntu-latest

    # Tope duro. El default de GitHub es 360 min (6 horas).
    # Un build normal tarda ~1 min. Si pasa de 10, algo esta roto.
    timeout-minutes: 10

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Build desde Notion
        timeout-minutes: 5
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run build

      - name: Verificar que el build genero algo
        run: |
          if [ ! -f ./dist/blog/index.html ]; then
            echo "ERROR: no se genero dist/blog/index.html. Abortando deploy."
            exit 1
          fi
          echo "Archivos generados:"
          find ./dist/blog -type f | wc -l

      - name: Pagina 404 (para que el router de /blog caiga a la copia historica si falta un post)
        run: |
          [ -f ./dist/404.html ] || printf '<!doctype html><meta charset="utf-8"><title>404</title><h1>404</h1>' > ./dist/404.html

      # Antes: SFTP a DreamHost (dado de baja el 19/10/2026).
      # Ahora: Cloudflare Pages, proyecto "bimarg-blog". El Worker "bimarg-blog-router"
      # sirve www.bimarg.com/blog/* desde este proyecto.
      - name: Deploy a Cloudflare Pages
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2eef9135dd2520b16ec2401146bfc6cc
        run: |
          npx --yes wrangler@4 pages deploy ./dist --project-name bimarg-blog --branch main --commit-dirty=true
          echo "Deploy OK"

# .github/workflows/deploy.yml
#
# BIMARG Blog — Deploy automático a DreamHost
#
# Se ejecuta:
#   - Cada vez que pushés cambios a la rama main
#   - Cada hora (para publicar posts nuevos en Notion)
#
# Secrets requeridos en GitHub → Settings → Secrets:
#   NOTION_API_KEY      — tu Notion integration token
#   NOTION_DATABASE_ID  — ID de la DB "Blog BIMARG"
#   FTP_HOST            — ej: ftp.bimarg.com
#   FTP_USERNAME        — usuario FTP de DreamHost
#   FTP_PASSWORD        — contraseña FTP de DreamHost
#   FTP_SERVER_DIR      — carpeta en DreamHost, ej: /blog

name: Deploy Blog BIMARG

on:
  push:
    branches: [main]
  schedule:
    # Cada hora en punto (UTC) — ajustá si querés otra frecuencia
    - cron: "0 * * * *"
  # Permite triggerear manualmente desde GitHub → Actions
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build desde Notion + Deploy FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Build — generar HTML desde Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run build

      - name: Deploy a DreamHost vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/blog/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Solo sube archivos que cambiaron (más rápido)
          dangerous-clean-slate: false
